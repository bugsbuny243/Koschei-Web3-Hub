name: Temporary validator gofmt snapshot

on:
  pull_request:
    paths:
      - 'koschei/api/internal/http/owner_solana_validator_telemetry.go'
      - 'koschei/api/internal/http/owner_solana_validator_telemetry_test.go'
      - '.github/workflows/temporary-validator-gofmt.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Print exactly gofmt-normalized snapshots for PR update
        run: |
          set -euo pipefail
          for filename in koschei/api/internal/http/owner_solana_validator_telemetry.go koschei/api/internal/http/owner_solana_validator_telemetry_test.go; do
            gofmt -w "$filename"
            echo "FORMATTED_BEGIN:$filename"
            base64 -w0 "$filename"
            echo
            echo "FORMATTED_END:$filename"
          done
