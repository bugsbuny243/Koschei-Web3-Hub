name: Temporary formatting of signed SOC candidate queue
on:
  push:
    branches: [feat/owner-soc-signed-verdict-triage-20261031]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed Go source and remove temporary workflow
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/handlers/owner_soc_verdict_candidates.go \
            koschei/api/internal/handlers/owner_incident_immutable_verdict_ref_postgres_test.go \
            koschei/api/internal/http/server.go \
            koschei/api/internal/http/owner_soc_readiness_route_test.go \
            koschei/api/internal/http/owner_soc_triage_page.go
          git config user.name 'koschei-ci-formatter'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-owner-signed-candidates-gofmt.yml
          git add koschei/api/internal/handlers koschei/api/internal/http
          git commit -m 'style(go): format SOC owner signed verdict triage'
          git push origin HEAD:feat/owner-soc-signed-verdict-triage-20261031
