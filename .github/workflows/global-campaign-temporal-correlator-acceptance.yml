name: Global Campaign Temporal Correlator Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - ".github/workflows/global-campaign-temporal-correlator-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - ".github/workflows/global-campaign-temporal-correlator-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-correlator:
    name: Prove deterministic event-time correlation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_temporal_correlator.go internal/services/global_campaign_temporal_correlator_test.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            exit 1
          fi
      - name: Run temporal correlator acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignTemporal' -count=1
