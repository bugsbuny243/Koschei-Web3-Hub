name: Temporary OpenAPI Refresh

on:
  push:
    branches:
      - feat/evm-probe-route-f07
    paths:
      - ".github/workflows/_temporary-openapi-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/evm-probe-route-f07
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate canonical OpenAPI contract
        run: go run ./cmd/openapi-gen
      - name: Commit generated contract only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- openapi.yaml && exit 0
          git config user.name "koschei-contract-bot"
          git config user.email "koschei-contract-bot@users.noreply.github.com"
          git add openapi.yaml
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh generated OpenAPI contract"
          git push origin HEAD:feat/evm-probe-route-f07
