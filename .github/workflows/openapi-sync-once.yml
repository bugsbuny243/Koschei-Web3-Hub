name: OpenAPI Sync Once

on:
  push:
    paths:
      - '.github/workflows/openapi-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: koschei/api/go.mod
          cache: true
          cache-dependency-path: koschei/api/go.sum
      - name: Generate OpenAPI
        run: cd koschei/api && go run ./cmd/openapi-gen
      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          git add koschei/api/openapi.yaml
          if git diff --cached --quiet; then
            echo 'OpenAPI already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync generated OpenAPI contract'
          git push origin HEAD:main
