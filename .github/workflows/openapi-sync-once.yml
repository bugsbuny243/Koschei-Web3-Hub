name: OpenAPI Sync Once

on:
  push:
    branches:
      - chore/web3-repo-refresh-main-2026-09-14

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: chore/web3-repo-refresh-main-2026-09-14
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate OpenAPI from boot chain
        working-directory: koschei/api
        run: go run ./cmd/openapi-gen
      - name: Commit generated contract when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- koschei/api/openapi.yaml; then
            echo "openapi.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koschei/api/openapi.yaml
          git commit -m "docs: regenerate OpenAPI contract"
          git push origin HEAD:chore/web3-repo-refresh-main-2026-09-14
