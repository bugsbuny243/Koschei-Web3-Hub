      - "koschei/api/internal/services/holder_role_snapshot_test.go"
      - "koschei/api/internal/handlers/holder_distribution_transport.go"
      - "koschei/api/internal/handlers/holder_distribution_transport_test.go"
      - "koschei/api/internal/handlers/holder_intelligence_core.go"
      - "koschei/api/internal/handlers/creator_relation_canonical_verification.go"
      - "koschei/api/internal/handlers/creator_relation_canonical_verification_test.go"
      - "koschei/api/internal/handlers/creator_source_context_resolution.go"
      - "koschei/api/internal/services/actor_distribution_target.go"
      - "koschei/api/internal/services/actor_initial_recipients.go"
      - "koschei/api/internal/services/actor_initial_recipient_transport.go"
      - "koschei/api/internal/services/actor_initial_recipient_ata_fallback_test.go"
      - "koschei/api/internal/services/solana_associated_token_address.go"
      - "koschei/api/internal/services/launch_forensics.go"
      - "koschei/api/internal/services/launch_forensics_ata.go"
      - "koschei/api/internal/services/launch_forensics_test.go"
      - "koschei/api/internal/services/launch_forensics.go"
      - "koschei/api/internal/services/launch_forensics_ata.go"
      - "koschei/api/internal/services/launch_forensics_test.go"
      - "koschei/api/internal/handlers/actor_recipient_transport.go"
      - "koschei/api/internal/handlers/actor_recipient_transport_test.go"
      - "koschei/api/internal/handlers/actor_creator_radar_integration.go"
      - "koschei/api/internal/handlers/actor_creator_request_scope.go"
      - "koschei/api/internal/handlers/actor_creator_request_scope_test.go"
      - "koschei/api/internal/handlers/actor_distribution_request_scope.go"
      - "koschei/api/internal/handlers/actor_distribution_investigation.go"
      - ".github/workflows/holder-launch-evidence-acceptance.yml"
  pull_request:
    paths:
      - "koschei/api/internal/services/holder_role_snapshot.go"
      - "koschei/api/internal/services/holder_role_snapshot_test.go"
      - "koschei/api/internal/handlers/holder_distribution_transport.go"
      - "koschei/api/internal/handlers/holder_distribution_transport_test.go"
      - "koschei/api/internal/handlers/holder_intelligence_core.go"
      - "koschei/api/internal/handlers/creator_relation_canonical_verification.go"
      - "koschei/api/internal/handlers/creator_relation_canonical_verification_test.go"
      - "koschei/api/internal/handlers/creator_source_context_resolution.go"
      - "koschei/api/internal/services/actor_distribution_target.go"
      - "koschei/api/internal/services/actor_initial_recipients.go"
      - "koschei/api/internal/services/actor_initial_recipient_transport.go"
      - "koschei/api/internal/services/actor_initial_recipient_ata_fallback_test.go"
      - "koschei/api/internal/services/solana_associated_token_address.go"
      - "koschei/api/internal/handlers/actor_recipient_transport.go"
      - "koschei/api/internal/handlers/actor_recipient_transport_test.go"
      - "koschei/api/internal/handlers/actor_creator_radar_integration.go"
      - "koschei/api/internal/handlers/actor_creator_request_scope.go"
      - "koschei/api/internal/handlers/actor_creator_request_scope_test.go"
      - "koschei/api/internal/handlers/actor_distribution_request_scope.go"
      - "koschei/api/internal/handlers/actor_distribution_investigation.go"
      - ".github/workflows/holder-launch-evidence-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Prove provider-neutral holder and creator launch evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Run holder and ATA service contract tests
        run: |
          set -euo pipefail
          go test -v ./internal/services \
            -run '^(TestAnalyzeSolanaHolderRolesSnapshotIsProviderNeutral|TestSolanaHolderOwnerAddressesPreservesExactCaseAndOrder|TestAnalyzeSolanaHolderRolesSnapshotFailsClosedWhenDominantOwnerMetadataMissing|TestDeriveSolanaAssociatedTokenAddressIsDeterministicAndOffCurve|TestSolanaAssociatedTokenAddressCandidatesUseMintProgramWhenKnown|TestActorRecipientDerivedATAFallbackFindsHistoryWithoutPromotingInitialRecipient|TestLaunchATAFairShareBudgetsDistributeWithoutStarvation|TestLaunchATAFairShareBudgetsNeverExceedSmallBudget|TestLaunchATAFairShareBudgetLeavesParsedTransactionCapacity) \
            -count=1
      - name: Run RPC-managed holder and creator verification tests
        run: |
          set -euo pipefail
          go test -v ./internal/handlers \
            -run '^(TestHolderDistributionTransportUsesOnlySolanaRPCProof|TestVerifyCanonicalCreatorRelationRequiresSignerMintAndLaunchSemantics|TestVerifyCanonicalCreatorRelationRejectsNonSigner|TestVerifyCanonicalCreatorRelationRejectsWrongMint|TestVerifyCanonicalCreatorRelationCandidatesRecoversFromRejectedFirstSignature|TestCanonicalCreatorSignatureCandidatesPrioritizeCreationAndDeduplicate|TestInvestigateActorInitialRecipientsUsesRPCManagerFailover|TestRequestScopeCanonicalCreatorRelationPreservesVerifiedEvidence|TestRequestScopeCanonicalCreatorRelationNeverUpgradesIncompleteSource|TestRequestScopeCanonicalCreatorRelationExternalObservationStaysObserved)$' \
            -count=1
 \
            -count=1
      - name: Run RPC-managed holder and creator verification tests
        run: |
          set -euo pipefail
          go test -v ./internal/handlers \
            -run '^(TestHolderDistributionTransportUsesOnlySolanaRPCProof|TestVerifyCanonicalCreatorRelationRequiresSignerMintAndLaunchSemantics|TestVerifyCanonicalCreatorRelationRejectsNonSigner|TestVerifyCanonicalCreatorRelationRejectsWrongMint|TestVerifyCanonicalCreatorRelationCandidatesRecoversFromRejectedFirstSignature|TestCanonicalCreatorSignatureCandidatesPrioritizeCreationAndDeduplicate|TestInvestigateActorInitialRecipientsUsesRPCManagerFailover|TestRequestScopeCanonicalCreatorRelationPreservesVerifiedEvidence|TestRequestScopeCanonicalCreatorRelationNeverUpgradesIncompleteSource|TestRequestScopeCanonicalCreatorRelationExternalObservationStaysObserved)$' \
            -count=1
