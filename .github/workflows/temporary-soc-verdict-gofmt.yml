name: Temporary SOC signed-verdict gofmt

on:
  pull_request:
    paths:
      - 'koschei/api/internal/handlers/**'
      - '.github/workflows/temporary-soc-verdict-gofmt.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical gofmt sources
        run: |
          set -euo pipefail
          for file in koschei/api/internal/handlers/owner_incidents.go koschei/api/internal/handlers/owner_incident_unified_verdict_ref.go koschei/api/internal/handlers/owner_incident_unified_verdict_ref_postgres_test.go koschei/api/internal/handlers/security_radar.go; do
            gofmt -w "$file"
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
