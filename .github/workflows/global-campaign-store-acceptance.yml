name: Global Campaign Store Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/migrations/125_global_campaign_store.sql"
      - ".github/workflows/global-campaign-store-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/migrations/125_global_campaign_store.sql"
      - ".github/workflows/global-campaign-store-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-store:
    name: Prove durable campaign memory on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_campaign_store_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_campaign_store_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify migration numbering
        run: python3 scripts/check_migration_numbering.py
      - name: Apply migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_campaign_store_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" >/dev/null
          done
      - name: Run Global Campaign store acceptance
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_campaign_store_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -v ./internal/services -run '^TestGlobalCampaignStorePostgres17$' -count=1
