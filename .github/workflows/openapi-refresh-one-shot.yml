name: One-shot OpenAPI refresh

on:
  push:
    branches:
      - fix/arvis-telegram-results-20261005
    paths:
      - .github/workflows/openapi-refresh-one-shot.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/arvis-telegram-results-20261005
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Generate canonical OpenAPI and remove one-shot workflow
        working-directory: koschei/api
        run: |
          set -euo pipefail
          go run ./cmd/openapi-gen
          rm ../../.github/workflows/openapi-refresh-one-shot.yml
      - name: Commit generated contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add koschei/api/openapi.yaml .github/workflows/openapi-refresh-one-shot.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh OpenAPI for ARVIS Telegram routes'
          git push origin HEAD:fix/arvis-telegram-results-20261005
