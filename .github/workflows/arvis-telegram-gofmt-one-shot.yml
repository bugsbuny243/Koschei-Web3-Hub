name: One-shot ARVIS Telegram gofmt

on:
  push:
    branches:
      - fix/arvis-telegram-results-20261005
    paths:
      - .github/workflows/arvis-telegram-gofmt-one-shot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/arvis-telegram-results-20261005
          fetch-depth: 0
      - name: Format changed Go sources and remove one-shot workflow
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/cryptobrief/arvis_delivery.go \
            koschei/api/internal/cryptobrief/arvis_delivery_test.go \
            koschei/api/internal/cryptobrief/arvis_http.go \
            koschei/api/internal/cryptobrief/arvis_inbound.go \
            koschei/api/internal/cryptobrief/arvis_webhook.go \
            koschei/api/internal/cryptobrief/delivery.go \
            koschei/api/internal/cryptobrief/postgres_test.go \
            koschei/api/internal/cryptobrief/telegram_setup.go \
            koschei/api/internal/handlers/security_radar_alert_wrapper.go \
            koschei/api/internal/http/crypto_brief_routes.go \
            koschei/api/internal/http/route_inventory.go \
            koschei/api/internal/http/static_aliases.go \
            koschei/api/internal/jobs/store.go \
            koschei/api/internal/openapi/inventory.go \
            koschei/api/internal/defense/sentinel_effect_evidence_v01.go \
            koschei/api/internal/defense/control_contracts.go \
            koschei/api/public_single_css_contract_test.go \
            koschei/api/runtime_workers.go
          rm .github/workflows/arvis-telegram-gofmt-one-shot.yml
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Format ARVIS Telegram change set'
          git push origin HEAD:fix/arvis-telegram-results-20261005
