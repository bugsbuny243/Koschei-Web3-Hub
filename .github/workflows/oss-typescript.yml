name: ARVIS OSS TypeScript

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "oss/event-normalizer/**"
      - "oss/schemas/**"
      - "oss/verifier/**"
      - ".github/workflows/oss-typescript.yml"
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "oss/event-normalizer/**"
      - "oss/schemas/**"
      - "oss/verifier/**"
      - ".github/workflows/oss-typescript.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - oss/event-normalizer
          - oss/verifier/typescript
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Build reviewable package and checksum evidence
        run: |
          mkdir -p release-package
          npm pack --pack-destination release-package
          sha256sum release-package/*.tgz > release-package/SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > release-package/SOURCE_REVISION
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ matrix.package }}/release-package/
          retention-days: 30
