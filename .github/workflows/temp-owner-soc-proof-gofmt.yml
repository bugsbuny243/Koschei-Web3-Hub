name: Temporary exact gofmt for owner SOC readiness
on:
  push:
    branches: [feat/soc-owner-signed-receipt-readiness-20261031]
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply canonical formatting then self-remove workflow
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/handlers/owner_soc_signed_receipt_readiness.go \
            koschei/api/internal/handlers/owner_soc_readiness.go \
            koschei/api/internal/handlers/owner_soc_signed_receipt_readiness_test.go \
            koschei/api/internal/handlers/owner_incident_immutable_verdict_ref_postgres_test.go
          git config user.name 'koschei-ci-formatter'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-owner-soc-proof-gofmt.yml
          git add koschei/api/internal/handlers
          git commit -m 'style(go): format owner SOC signature readiness'
          git push origin HEAD:feat/soc-owner-signed-receipt-readiness-20261031
