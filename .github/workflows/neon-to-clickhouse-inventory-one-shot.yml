name: Neon to ClickHouse inventory one-shot

on:
  push:
    branches:
      - migration/neon-to-clickhouse-inventory-20261005
    paths:
      - .github/workflows/neon-to-clickhouse-inventory-one-shot.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select read-only PostgreSQL source secret
        env:
          DATABASE_READ_URL: ${{ secrets.DATABASE_READ_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${DATABASE_READ_URL}" ]; then
            printf '%s' "${DATABASE_READ_URL}" > "${RUNNER_TEMP}/source_url"
          elif [ -n "${DATABASE_URL}" ]; then
            printf '%s' "${DATABASE_URL}" > "${RUNNER_TEMP}/source_url"
          else
            echo "DATABASE_READ_URL or DATABASE_URL secret is required" >&2
            exit 1
          fi
          chmod 600 "${RUNNER_TEMP}/source_url"

      - name: Inventory PostgreSQL schemas and tables without row data
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(cat "${RUNNER_TEMP}/source_url")"
          OUT="${RUNNER_TEMP}/neon-inventory.txt"
          : > "${OUT}"

          echo '=== PostgreSQL version ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -Atc "select version();" >> "${OUT}"

          echo >> "${OUT}"
          echo '=== User schemas ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select nspname
            from pg_namespace
            where nspname not like 'pg_%'
              and nspname <> 'information_schema'
            order by nspname;
          " >> "${OUT}"

          echo >> "${OUT}"
          echo '=== Tables: schema, table, estimated_rows, total_bytes ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select n.nspname,
                   c.relname,
                   greatest(c.reltuples::bigint, 0),
                   pg_total_relation_size(c.oid)
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where c.relkind in ('r','p')
              and n.nspname not like 'pg_%'
              and n.nspname <> 'information_schema'
            order by pg_total_relation_size(c.oid) desc, n.nspname, c.relname;
          " >> "${OUT}"

          echo >> "${OUT}"
          echo '=== Primary keys ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select ns.nspname,
                   tbl.relname,
                   con.conname,
                   string_agg(att.attname, ',' order by u.ordinality)
            from pg_constraint con
            join pg_class tbl on tbl.oid = con.conrelid
            join pg_namespace ns on ns.oid = tbl.relnamespace
            join unnest(con.conkey) with ordinality as u(attnum, ordinality) on true
            join pg_attribute att on att.attrelid = tbl.oid and att.attnum = u.attnum
            where con.contype = 'p'
              and ns.nspname not like 'pg_%'
              and ns.nspname <> 'information_schema'
            group by ns.nspname, tbl.relname, con.conname
            order by ns.nspname, tbl.relname;
          " >> "${OUT}"

          echo >> "${OUT}"
          echo '=== Foreign keys ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select ns.nspname,
                   tbl.relname,
                   con.conname,
                   rns.nspname,
                   ref.relname
            from pg_constraint con
            join pg_class tbl on tbl.oid = con.conrelid
            join pg_namespace ns on ns.oid = tbl.relnamespace
            join pg_class ref on ref.oid = con.confrelid
            join pg_namespace rns on rns.oid = ref.relnamespace
            where con.contype = 'f'
              and ns.nspname not like 'pg_%'
              and ns.nspname <> 'information_schema'
            order by ns.nspname, tbl.relname, con.conname;
          " >> "${OUT}"

          echo >> "${OUT}"
          echo '=== Sequences ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select sequence_schema, sequence_name
            from information_schema.sequences
            where sequence_schema not like 'pg_%'
              and sequence_schema <> 'information_schema'
            order by sequence_schema, sequence_name;
          " >> "${OUT}"

          echo >> "${OUT}"
          echo '=== Extensions ===' >> "${OUT}"
          psql "${SOURCE_URL}" -X -v ON_ERROR_STOP=1 -P pager=off -F $'\t' -Atc "
            select extname, extversion
            from pg_extension
            order by extname;
          " >> "${OUT}"

          cat "${OUT}"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v7
        with:
          name: neon-to-clickhouse-inventory
          path: ${{ runner.temp }}/neon-inventory.txt
          if-no-files-found: error
          retention-days: 7
