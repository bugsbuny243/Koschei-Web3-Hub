name: SOC Authority Watch Final Format
on:
  push:
    branches:
      - feat/solana-bounded-authority-watch-sensor-20261101
    paths:
      - .github/workflows/soc-authority-watch-final-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: feat/solana-bounded-authority-watch-sensor-20261101
      - name: Format watcher and acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w koschei/api/internal/services/solana_authority_watch_sensor.go koschei/api/internal/services/solana_authority_watch_sensor_test.go
          if ! git diff --quiet -- koschei/api/internal/services/solana_authority_watch_sensor.go koschei/api/internal/services/solana_authority_watch_sensor_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- koschei/api/internal/services/solana_authority_watch_sensor.go koschei/api/internal/services/solana_authority_watch_sensor_test.go
            git commit -m 'style(go): format persistent bootstrap-gap sensor'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
