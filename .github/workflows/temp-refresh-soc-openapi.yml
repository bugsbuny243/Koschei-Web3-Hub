name: Temporary refresh OpenAPI after route inventory
on:
  push:
    branches: [feat/owner-soc-signed-verdict-triage-20261031]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: koschei/api/go.mod
      - name: Refresh canonical OpenAPI and remove this workflow
        run: |
          set -euo pipefail
          cd koschei/api
          go run ./cmd/openapi-gen
          go run ./cmd/openapi-gen -check
          cd ../..
          git config user.name 'koschei-ci-generator'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temp-refresh-soc-openapi.yml
          git add koschei/api/openapi.yaml
          git commit -m 'docs(api): synchronize signed SOC route inventory and OpenAPI'
          git push origin HEAD:feat/owner-soc-signed-verdict-triage-20261031
