name: Release Gates Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "koschei/api/**"
      - ".github/workflows/release-gates-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    name: Go 1.26.7, PostgreSQL 17, race and evidence gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_release_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_release_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go 1.26.7
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Record toolchain
        run: go version
      - name: Download modules
        run: go mod download
      - name: Require gofmt clean tree
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi
      - name: Apply all migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "RUN ${migration}"
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_release_gate \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}"
            echo "PASS ${migration}"
          done
      - name: Verify PostgreSQL 17 retention hash primitives
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          result="$(psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=koschei_release_gate --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="SELECT encode(sha256(convert_to('{}','UTF8')),'hex');")"
          test "${result}" = "44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a"
          echo "sha256(convert_to())=${result}"
      - name: Verify archive, resume and checksum fail-closed on PostgreSQL 17
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_release_gate?sslmode=disable
        run: go test -v ./internal/services -run '^TestRetentionArchiveDeletePostgres17$' -count=1
      - name: Test all packages
        run: go test ./...
      - name: Race-test July consolidation packages
        run: go test -race ./internal/handlers ./internal/services ./internal/defense
      - name: Vet all packages
        run: go vet ./...
      - name: Build all packages
        run: CGO_ENABLED=0 GOOS=linux go build ./...

  production-acceptance:
    name: Deployed public product acceptance
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: full-verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://tradepigloball.co
    steps:
      - name: Checkout acceptance verifier
        uses: actions/checkout@v7

      - name: Wait for deployed product and verify customer-visible surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          wait_contract() {
            local name="$1" path="$2" marker="$3" attempts="${4:-36}" code=""
            for attempt in $(seq 1 "${attempts}"); do
              code="$(curl --location --silent --show-error --max-time 20 \
                --output "diagnostics/${name}.body" \
                --write-out '%{http_code}' \
                "${BASE_URL}${path}" || true)"
              if [ "${code}" = "200" ] && grep -Fq "${marker}" "diagnostics/${name}.body"; then
                echo "PASS ${path} attempt=${attempt}"
                return 0
              fi
              case "${code}" in
                000|502|503|504|200)
                  echo "WAIT ${path} attempt=${attempt}/${attempts} code=${code}" >&2
                  ;;
                *)
                  echo "RELEASE_ACCEPTANCE_FAILURE: ${path} returned HTTP ${code}." >&2
                  exit 31
                  ;;
              esac
              sleep 10
            done
            echo "RELEASE_ACCEPTANCE_TIMEOUT: ${path} never exposed ${marker}." >&2
            exit 32
          }

          wait_contract health /health '"status":"ok"'
          wait_contract login /login 'KOSCHEI ARVIS'
          wait_contract scan /scan 'public-solana-scan.js'
          wait_contract cases '/api/public/cases?limit=100' '"ok":true'
          wait_contract soc /api/public/soc/feed '"ok":true'

          node koschei/api/scripts/verify-public-registry-smoke-response.js \
            diagnostics/cases.body > diagnostics/public-registry-smoke.json

          echo 'RELEASE_ACCEPTANCE_PASS: deployed public product and registry are operational.'
