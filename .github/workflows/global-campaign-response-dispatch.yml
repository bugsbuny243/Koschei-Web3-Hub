name: Global Campaign Response Dispatch Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign_response_dispatch*.go"
      - "koschei/api/internal/services/global_campaign_response_authorization*.go"
      - ".github/workflows/global-campaign-response-dispatch.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign_response_dispatch*.go"
      - "koschei/api/internal/services/global_campaign_response_authorization*.go"
      - ".github/workflows/global-campaign-response-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-dispatch:
    name: Prove response dispatch remains non-authoritative and replay-safe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_response_dispatch.go internal/services/global_campaign_response_dispatch_test.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/services/global_campaign_response_dispatch.go internal/services/global_campaign_response_dispatch_test.go
            exit 1
          fi
      - name: Run response dispatch acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignResponseDispatchEnvelope' -count=1
