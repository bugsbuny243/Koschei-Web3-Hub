name: SOC PB03 GoFmt One Shot
on:
  push:
    branches:
      - feat/live-soc-approval-exposure-pb03-20261101
    paths:
      - .github/workflows/soc-pb03-gofmt-one-shot.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Format only the four PB03 Go files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            koschei/api/internal/http/customer_approval_scan_live_threat_test.go \
            koschei/api/internal/http/customer_approval_scan_routes.go \
            koschei/api/internal/http/customer_approval_scan_threat_test.go \
            koschei/api/internal/services/soc_approval_threat_detection_test.go
          if ! git diff --quiet -- koschei/api/internal/http/customer_approval_scan_live_threat_test.go koschei/api/internal/http/customer_approval_scan_routes.go koschei/api/internal/http/customer_approval_scan_threat_test.go koschei/api/internal/services/soc_approval_threat_detection_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- \
              koschei/api/internal/http/customer_approval_scan_live_threat_test.go \
              koschei/api/internal/http/customer_approval_scan_routes.go \
              koschei/api/internal/http/customer_approval_scan_threat_test.go \
              koschei/api/internal/services/soc_approval_threat_detection_test.go
            git commit -m 'style(go): gofmt SOC-PB03 live approval detector'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
