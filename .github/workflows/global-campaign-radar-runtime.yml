name: Global Campaign Radar Runtime

on:
  pull_request:
    paths:
      - 'koschei/api/runtime_workers.go'
      - 'koschei/api/global_radar_runtime.go'
      - 'koschei/api/global_radar_background_config_test.go'
      - 'koschei/api/internal/handlers/owner_radar_overview_fast.go'
      - 'koschei/api/internal/services/global_campaign_read.go'
      - 'koschei/api/internal/services/global_radar_background_telemetry.go'
      - 'koschei/api/internal/services/global_radar_background_telemetry_test.go'
      - 'koschei/api/internal/services/global_campaign_radar_runtime.go'
      - 'koschei/api/internal/services/global_campaign_radar_runtime_test.go'
      - 'koschei/api/migrations/129_global_campaign_radar_ingest.sql'
      - '.github/workflows/global-campaign-radar-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'koschei/api/runtime_workers.go'
      - 'koschei/api/global_radar_runtime.go'
      - 'koschei/api/global_radar_background_config_test.go'
      - 'koschei/api/internal/handlers/owner_radar_overview_fast.go'
      - 'koschei/api/internal/services/global_campaign_read.go'
      - 'koschei/api/internal/services/global_radar_background_telemetry.go'
      - 'koschei/api/internal/services/global_radar_background_telemetry_test.go'
      - 'koschei/api/internal/services/global_campaign_radar_runtime.go'
      - 'koschei/api/internal/services/global_campaign_radar_runtime_test.go'
      - 'koschei/api/migrations/129_global_campaign_radar_ingest.sql'
      - '.github/workflows/global-campaign-radar-runtime.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: gofmt
        run: |
          set -euo pipefail
          test -z "$(gofmt -l runtime_workers.go global_radar_runtime.go global_radar_background_config_test.go internal/handlers/owner_radar_overview_fast.go internal/services/global_campaign_read.go internal/services/global_radar_background_telemetry.go internal/services/global_radar_background_telemetry_test.go internal/services/global_campaign_radar_runtime.go internal/services/global_campaign_radar_runtime_test.go)"
      - name: Runtime and campaign acceptance
        run: |
          set -euo pipefail
          go test -race ./internal/services -run '^(TestProjectSecurityRadarVerdict|TestGlobalCampaign|TestCollectGlobalRadarBackgroundTelemetryPersistsSolanaValidatorObservations|TestProjectSolanaValidatorTelemetry)' -count=1
          go test -race . -run '^(TestParseRuntimeRole|TestRuntimeRoleCapabilities|TestBuildGlobalRadarBackgroundTelemetryConfig)' -count=1
          go test -race ./internal/handlers -run '^$' -count=1
