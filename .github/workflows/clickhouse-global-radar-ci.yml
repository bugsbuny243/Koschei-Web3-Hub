name: ClickHouse Global Radar CI

on:
  pull_request:
    paths:
      - "koschei/api/clickhouse/migrations/005_global_radar_graph_records.sql"
      - "koschei/api/clickhouse/migrations/005_global_radar_graph_records.sql.sha256"
      - "koschei/api/internal/clickhouse/global_radar_store.go"
      - "koschei/api/internal/clickhouse/global_radar_store_test.go"
      - "koschei/api/internal/services/global_radar_*.go"
      - "koschei/api/internal/services/solana_validator_telemetry.go"
      - "koschei/api/internal/services/solana_validator_telemetry_test.go"
      - "koschei/api/cmd/clickhouse-global-radar-read/**"
      - ".github/workflows/clickhouse-global-radar-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/clickhouse/migrations/005_global_radar_graph_records.sql"
      - "koschei/api/clickhouse/migrations/005_global_radar_graph_records.sql.sha256"
      - "koschei/api/internal/clickhouse/global_radar_store.go"
      - "koschei/api/internal/clickhouse/global_radar_store_test.go"
      - "koschei/api/internal/services/global_radar_*.go"
      - "koschei/api/cmd/clickhouse-global-radar-read/**"
      - ".github/workflows/clickhouse-global-radar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate append-first Global Radar graph memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        env:
          CLICKHOUSE_DB: koschei_web3
        ports:
          - 8123:8123
        options: >-
          --health-cmd="clickhouse-client --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Require gofmt-clean Global Radar paths
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/clickhouse/global_radar_store.go internal/clickhouse/global_radar_store_test.go internal/services/global_radar_*.go internal/services/solana_validator_telemetry.go internal/services/solana_validator_telemetry_test.go)"
          test -z "${unformatted}" || { printf 'unformatted files:\n%s\n' "${unformatted}" >&2; exit 1; }

      - name: Verify reviewed migration checksum
        run: |
          set -euo pipefail
          cd clickhouse/migrations
          sha256sum -c 005_global_radar_graph_records.sql.sha256

      - name: Validate migration on ClickHouse 26.2
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"
          docker exec -i "${container_id}" clickhouse-client --multiquery < clickhouse/migrations/005_global_radar_graph_records.sql

          table_meta="$(docker exec "${container_id}" clickhouse-client --query "SELECT concat(engine,'|',sorting_key) FROM system.tables WHERE database='koschei_web3' AND name='global_radar_graph_records' FORMAT TSVRaw")"
          payload_hash_type="$(docker exec "${container_id}" clickhouse-client --query "SELECT type FROM system.columns WHERE database='koschei_web3' AND table='global_radar_graph_records' AND name='payload_sha256' FORMAT TSVRaw")"
          observed_type="$(docker exec "${container_id}" clickhouse-client --query "SELECT type FROM system.columns WHERE database='koschei_web3' AND table='global_radar_graph_records' AND name='observed_at' FORMAT TSVRaw")"

          test "${table_meta}" = "ReplacingMergeTree|record_type, network, record_date, subject_id, record_id, payload_sha256"
          test "${payload_hash_type}" = "FixedString(64)"
          test "${observed_type}" = "Nullable(DateTime64(9, 'UTC'))"

      - name: Validate replay convergence and state-history preservation
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"

          docker exec -i "${container_id}" clickhouse-client --multiquery <<'SQL'
          INSERT INTO koschei_web3.global_radar_graph_records
          (record_type,record_id,schema_version,snapshot_sha256,network,secondary_network,subject_id,target_subject_id,record_kind,evidence_status,evidence_refs,observed_at,recorded_at,payload_json,payload_sha256,ingest_version)
          VALUES
          ('relation','edge-1','koschei.global-radar-relation.v1',repeat('c',64),'ethereum-mainnet','base-mainnet','source-1','target-1','bridge_transfer','unverified',[],NULL,toDateTime64('2026-09-23 19:00:00.000000001',9,'UTC'),'{"state":"unverified"}',repeat('a',64),1),
          ('relation','edge-1','koschei.global-radar-relation.v1',repeat('c',64),'ethereum-mainnet','base-mainnet','source-1','target-1','bridge_transfer','verified',['link-evidence-1'],NULL,toDateTime64('2026-09-23 19:01:00.000000001',9,'UTC'),'{"state":"verified"}',repeat('b',64),2),
          ('relation','edge-1','koschei.global-radar-relation.v1',repeat('c',64),'ethereum-mainnet','base-mainnet','source-1','target-1','bridge_transfer','unverified',[],NULL,toDateTime64('2026-09-23 19:00:00.000000001',9,'UTC'),'{"state":"unverified"}',repeat('a',64),3);
          SQL

          state_versions="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.global_radar_graph_records FINAL WHERE record_id='edge-1'")"
          unverified_versions="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.global_radar_graph_records FINAL WHERE record_id='edge-1' AND payload_sha256=repeat('a',64)")"
          verified_versions="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.global_radar_graph_records FINAL WHERE record_id='edge-1' AND payload_sha256=repeat('b',64)")"
          test "${state_versions}" = "2"
          test "${unverified_versions}" = "1"
          test "${verified_versions}" = "1"

          if docker exec "${container_id}" clickhouse-client --query "INSERT INTO koschei_web3.global_radar_graph_records (record_type,record_id,schema_version,snapshot_sha256,network,subject_id,record_kind,evidence_status,evidence_refs,recorded_at,payload_json,payload_sha256,ingest_version) VALUES ('observation','bad-hash','v1',repeat('c',64),'solana-mainnet','subject','state','observed',[],now64(9),'{}',repeat('z',64),4)"; then
            echo "invalid Global Radar payload hash unexpectedly accepted" >&2
            exit 1
          fi

      - name: Test Global Radar ClickHouse writer and reader
        run: go test ./internal/clickhouse -count=1

      - name: Compile Global Radar memory reader
        run: go test ./cmd/clickhouse-global-radar-read -count=1

      - name: Vet Global Radar ClickHouse paths
        run: go vet ./internal/clickhouse ./cmd/clickhouse-global-radar-read

      - name: Build Global Radar memory reader
        run: CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-global-radar-read
