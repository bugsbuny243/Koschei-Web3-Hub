name: ClickHouse Shadow CI

on:
  pull_request:
    paths:
      - "koschei/api/clickhouse/**"
      - "koschei/api/internal/clickhouse/**"
      - "koschei/api/cmd/clickhouse-shadow/**"
      - "koschei/api/cmd/clickhouse-schema/**"
      - ".github/workflows/clickhouse-shadow-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/clickhouse/**"
      - "koschei/api/internal/clickhouse/**"
      - "koschei/api/cmd/clickhouse-shadow/**"
      - "koschei/api/cmd/clickhouse-schema/**"
      - ".github/workflows/clickhouse-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ClickHouse schema, client and shadow copier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        env:
          CLICKHOUSE_DB: koschei_web3
        ports:
          - 8123:8123
        options: >-
          --health-cmd="clickhouse-client --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Require gofmt-clean ClickHouse paths
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/clickhouse cmd/clickhouse-shadow cmd/clickhouse-schema)"
          if [ -n "${unformatted}" ]; then
            printf '%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify reviewed migration checksum
        run: |
          set -euo pipefail
          cd clickhouse/migrations
          sha256sum -c 001_security_radar_stream_events.sql.sha256

      - name: Validate ClickHouse migration on 26.2
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"

          docker exec -i "${container_id}" \
            clickhouse-client \
            --multiquery \
            < clickhouse/migrations/001_security_radar_stream_events.sql

          docker exec "${container_id}" \
            clickhouse-client \
            --query 'SHOW CREATE TABLE koschei_web3.security_radar_stream_events' \
            | tee "${RUNNER_TEMP}/clickhouse-show-create.txt"

          grep -Fq 'ReplacingMergeTree(ingest_version)' "${RUNNER_TEMP}/clickhouse-show-create.txt"
          grep -Fq '`event_id` UUID' "${RUNNER_TEMP}/clickhouse-show-create.txt"
          grep -Fq '`decoded` JSON' "${RUNNER_TEMP}/clickhouse-show-create.txt"
          grep -Fq '`decoded_sha256` FixedString(64)' "${RUNNER_TEMP}/clickhouse-show-create.txt"
          grep -Fq '`raw_event_sha256` FixedString(64)' "${RUNNER_TEMP}/clickhouse-show-create.txt"

      - name: Validate replacement, identity and evidence-hash invariants
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"

          docker exec -i "${container_id}" \
            clickhouse-client \
            --multiquery <<'SQL'
          INSERT INTO koschei_web3.security_radar_stream_events
          (event_id,event_key,provider,stream_mode,network,module_id,event_type,target,target_type,signature,slot,program_id,evidence_quality,decoded,raw_event,decoded_sha256,raw_event_sha256,schema_version,created_at,ingest_version)
          VALUES
          (toUUID('11111111-1111-1111-1111-111111111111'),repeat('a',64),'solana_wss','logs_subscribe','solana-mainnet','pump_sybil_radar','test','FirstCase','token','SigA',1,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-07 00:00:00',3,'UTC'),1),
          (toUUID('11111111-1111-1111-1111-111111111111'),repeat('b',64),'solana_wss','logs_subscribe','solana-mainnet','pump_sybil_radar','test','LatestCase','token','SigA',1,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-07 00:00:00',3,'UTC'),2),
          (toUUID('22222222-2222-2222-2222-222222222222'),repeat('c',64),'solana_wss','logs_subscribe','solana-mainnet','pump_sybil_radar','test','AbCdEf123','token','SigB',2,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-07 00:00:01',3,'UTC'),1),
          (toUUID('33333333-3333-3333-3333-333333333333'),repeat('d',64),'solana_wss','logs_subscribe','solana-mainnet','pump_sybil_radar','test','abcdef123','token','SigC',3,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-07 00:00:02',3,'UTC'),1);
          SQL

          replacement_count="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.security_radar_stream_events FINAL WHERE event_id=toUUID('11111111-1111-1111-1111-111111111111')")"
          replacement_target="$(docker exec "${container_id}" clickhouse-client --query "SELECT target FROM koschei_web3.security_radar_stream_events FINAL WHERE event_id=toUUID('11111111-1111-1111-1111-111111111111') FORMAT TSVRaw")"
          case_distinct="$(docker exec "${container_id}" clickhouse-client --query "SELECT uniqExact(target) FROM koschei_web3.security_radar_stream_events FINAL WHERE event_id IN (toUUID('22222222-2222-2222-2222-222222222222'),toUUID('33333333-3333-3333-3333-333333333333'))")"

          test "${replacement_count}" = "1"
          test "${replacement_target}" = "LatestCase"
          test "${case_distinct}" = "2"

          if docker exec -i "${container_id}" clickhouse-client --query "INSERT INTO koschei_web3.security_radar_stream_events (event_id,event_key,provider,stream_mode,network,module_id,event_type,target,target_type,signature,slot,program_id,evidence_quality,decoded,raw_event,decoded_sha256,raw_event_sha256,schema_version,created_at,ingest_version) VALUES (toUUID('44444444-4444-4444-4444-444444444444'),repeat('z',64),'solana_wss','logs_subscribe','solana-mainnet','pump_sybil_radar','test','BadHash','token','SigD',4,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-07 00:00:03',3,'UTC'),1)"; then
            echo "invalid non-hex event_key unexpectedly accepted" >&2
            exit 1
          fi

      - name: Test ClickHouse client and schema guard
        run: go test ./internal/clickhouse -count=1

      - name: Compile ClickHouse commands
        run: go test ./cmd/clickhouse-shadow ./cmd/clickhouse-schema -count=1

      - name: Vet ClickHouse paths
        run: go vet ./internal/clickhouse ./cmd/clickhouse-shadow ./cmd/clickhouse-schema

      - name: Build ClickHouse commands
        run: |
          CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-shadow
          CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-schema
