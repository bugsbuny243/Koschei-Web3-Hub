name: Global Campaign Worker Fencing Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign_worker_lease*.go"
      - "koschei/api/migrations/128_global_campaign_worker_leases.sql"
      - ".github/workflows/global-campaign-worker-fencing.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign_worker_lease*.go"
      - "koschei/api/migrations/128_global_campaign_worker_leases.sql"
      - ".github/workflows/global-campaign-worker-fencing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-fencing:
    name: Prove stale Global Campaign workers are fenced
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_campaign_fencing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_campaign_fencing_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_worker_lease.go internal/services/global_campaign_worker_lease_postgres_test.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/services/global_campaign_worker_lease.go internal/services/global_campaign_worker_lease_postgres_test.go
            exit 1
          fi
      - name: Verify migration numbering
        run: python3 scripts/check_migration_numbering.py
      - name: Apply migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_campaign_fencing_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" >/dev/null
          done
      - name: Run fenced worker acceptance under race detector
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_campaign_fencing_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignWorkerLeasePostgres17$' -count=1
