name: Global Campaign Response Operator Telemetry Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/http/response_production_readiness*.go"
      - "koschei/api/internal/http/route_inventory.go"
      - "koschei/api/internal/services/global_campaign_response_production_readiness*.go"
      - ".github/workflows/global-campaign-response-operator-telemetry.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/http/response_production_readiness*.go"
      - "koschei/api/internal/http/route_inventory.go"
      - "koschei/api/internal/services/global_campaign_response_production_readiness*.go"
      - ".github/workflows/global-campaign-response-operator-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-telemetry:
    name: Prove owner response readiness stays fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/http/response_production_readiness.go internal/http/response_production_readiness_test.go internal/http/route_inventory.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/http/response_production_readiness.go internal/http/response_production_readiness_test.go internal/http/route_inventory.go
            exit 1
          fi
      - name: Run operator telemetry and route inventory acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/http -run '^(TestResponseProductionReadinessTelemetry|TestOwnerRouteMapIncludesResponseProductionReadinessTelemetry|TestProductionRouteInventoryMatchesBootChain|TestDatabaseOptionalPathsAreRegistered)' -count=1
