name: Global Campaign Signed Effect Attestation Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign_effect_attestation*.go"
      - "koschei/api/internal/services/global_campaign_effect_proof*.go"
      - ".github/workflows/global-campaign-signed-effect-attestation.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign_effect_attestation*.go"
      - "koschei/api/internal/services/global_campaign_effect_proof*.go"
      - ".github/workflows/global-campaign-signed-effect-attestation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-effect-attestation:
    name: Prove independent signed effect evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_effect_attestation.go internal/services/global_campaign_effect_attestation_test.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/services/global_campaign_effect_attestation.go internal/services/global_campaign_effect_attestation_test.go
            exit 1
          fi
      - name: Run signed effect attestation acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignEffectAttestation' -count=1
