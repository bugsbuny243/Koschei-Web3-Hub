name: SOC PB02 GoFmt One Shot
on:
  push:
    branches:
      - feat/soc-pb02-pre-sign-authority-cpi-detection-20261101
    paths:
      - .github/workflows/soc-pb02-gofmt-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Format PB02 Go files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w koschei/api/internal/handlers/transaction_guard_soc_pb02.go koschei/api/internal/handlers/transaction_guard_soc_pb02_test.go
          if ! git diff --quiet -- koschei/api/internal/handlers/transaction_guard_soc_pb02.go koschei/api/internal/handlers/transaction_guard_soc_pb02_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- koschei/api/internal/handlers/transaction_guard_soc_pb02.go koschei/api/internal/handlers/transaction_guard_soc_pb02_test.go
            git commit -m 'style(go): format SOC-PB02 evidence detector'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
