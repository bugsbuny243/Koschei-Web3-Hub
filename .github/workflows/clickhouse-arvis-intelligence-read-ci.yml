name: ClickHouse ARVIS Intelligence Read CI

on:
  pull_request:
    paths:
      - "koschei/api/internal/clickhouse/intelligence_read.go"
      - "koschei/api/internal/clickhouse/intelligence_read_test.go"
      - "koschei/api/internal/clickhouse/intelligence_projection.go"
      - "koschei/api/internal/clickhouse/intelligence_projection_test.go"
      - "koschei/api/cmd/clickhouse-intelligence-read/**"
      - "koschei/api/docs/clickhouse-arvis-intelligence-memory-v1.md"
      - ".github/workflows/clickhouse-arvis-intelligence-read-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/clickhouse/intelligence_read.go"
      - "koschei/api/internal/clickhouse/intelligence_read_test.go"
      - "koschei/api/internal/clickhouse/intelligence_projection.go"
      - "koschei/api/internal/clickhouse/intelligence_projection_test.go"
      - "koschei/api/cmd/clickhouse-intelligence-read/**"
      - "koschei/api/docs/clickhouse-arvis-intelligence-memory-v1.md"
      - ".github/workflows/clickhouse-arvis-intelligence-read-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate bounded ARVIS intelligence read and projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        env:
          CLICKHOUSE_DB: koschei_web3
        ports:
          - 8123:8123
        options: >-
          --health-cmd="clickhouse-client --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Require gofmt-clean intelligence read paths
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/clickhouse/intelligence_read.go internal/clickhouse/intelligence_read_test.go internal/clickhouse/intelligence_projection.go internal/clickhouse/intelligence_projection_test.go cmd/clickhouse-intelligence-read)"
          test -z "${unformatted}" || { printf 'unformatted files:\n%s\n' "${unformatted}" >&2; exit 1; }

      - name: Validate existing shadow schemas on ClickHouse 26.2
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"
          docker exec -i "${container_id}" clickhouse-client --multiquery < clickhouse/migrations/001_security_radar_stream_events.sql
          docker exec -i "${container_id}" clickhouse-client --multiquery < clickhouse/migrations/003_arvis_verdict_snapshots.sql

      - name: Validate exact event-id correlation and case-sensitive target boundary
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"
          docker exec -i "${container_id}" clickhouse-client --multiquery <<'SQL'
          INSERT INTO koschei_web3.security_radar_stream_events
          (event_id,event_key,provider,stream_mode,network,module_id,event_type,target,target_type,signature,slot,program_id,evidence_quality,decoded,raw_event,decoded_sha256,raw_event_sha256,schema_version,created_at,ingest_version)
          VALUES
          (toUUID('22222222-2222-2222-2222-222222222222'),repeat('a',64),'solana_rpc','journal','solana-mainnet','final_verdict_engine','trade','AbCdEfCaseTarget','token','ChainSig',7,'ProgramCase','raw_stream','{}','{}',repeat('b',64),repeat('c',64),1,toDateTime64('2026-09-08 12:00:00.123',3,'UTC'),1),
          (toUUID('33333333-3333-3333-3333-333333333333'),repeat('d',64),'solana_rpc','journal','solana-mainnet','final_verdict_engine','trade','abcdefcasetarget','token','OtherSig',8,'ProgramCase','raw_stream','{}','{}',repeat('e',64),repeat('f',64),1,toDateTime64('2026-09-08 12:00:01.123',3,'UTC'),1);

          INSERT INTO koschei_web3.arvis_verdict_snapshots
          (verdict_id,event_id,module_id,target,target_type,network,grade,risk_index,risk_level,verdict,recommendation,evidence,evidence_sha256,signals,signals_sha256,rule_version,signed,signature,source,event_type,provider,created_at,source_updated_at,source_version,schema_version)
          VALUES
          (toUUID('11111111-1111-1111-1111-111111111111'),toUUID('22222222-2222-2222-2222-222222222222'),'final_verdict_engine','AbCdEfCaseTarget','token','solana-mainnet','B',62,'high','BLOCK','review',['tx:abc'],repeat('1',64),'{}',repeat('2',64),'rules-v2',1,'SignedVerdict','arvis_stream','arvis_stream_verdict','solana_rpc',toDateTime64('2026-09-08 12:00:02.123456',6,'UTC'),toDateTime64('2026-09-08 12:00:03.123456',6,'UTC'),1,1);
          SQL
          exact_count="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.security_radar_stream_events FINAL WHERE target='AbCdEfCaseTarget'")"
          case_distinct="$(docker exec "${container_id}" clickhouse-client --query "SELECT uniqExact(target) FROM koschei_web3.security_radar_stream_events FINAL")"
          linked_count="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM (SELECT event_id,target,network FROM koschei_web3.arvis_verdict_snapshots FINAL WHERE target='AbCdEfCaseTarget' AND network='solana-mainnet') AS v INNER JOIN (SELECT event_id,target,network FROM koschei_web3.security_radar_stream_events FINAL WHERE target='AbCdEfCaseTarget' AND network='solana-mainnet') AS e ON v.event_id=e.event_id AND v.target=e.target AND v.network=e.network")"
          test "${exact_count}" = "1"
          test "${case_distinct}" = "2"
          test "${linked_count}" = "1"

      - name: Test intelligence memory projection fail-closed semantics
        run: go test ./internal/clickhouse -run 'TestProjectARVISMemory|TestValidateARVISMemorySnapshotForProjection' -count=1

      - name: Test intelligence read client
        run: go test ./internal/clickhouse -count=1

      - name: Compile intelligence read command
        run: go test ./cmd/clickhouse-intelligence-read -count=1

      - name: Vet intelligence read paths
        run: go vet ./internal/clickhouse ./cmd/clickhouse-intelligence-read

      - name: Build intelligence read command
        run: CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-intelligence-read
