name: Temporary ARVIS signed-final gofmt snapshot

on:
  pull_request:
    paths:
      - 'koschei/api/internal/services/**'
      - 'koschei/api/internal/handlers/**'
      - '.github/workflows/temporary-arvis-customer-auth-gofmt.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical gofmt source
        run: |
          set -euo pipefail
          for file in koschei/api/internal/services/global_radar_trusted_verdict_registry.go koschei/api/internal/services/unified_radar_runtime_verification_test.go koschei/api/internal/handlers/customer_investigation_response.go koschei/api/internal/handlers/customer_investigation_response_test.go koschei/api/internal/handlers/security_radar.go; do
            gofmt -w "$file"
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
