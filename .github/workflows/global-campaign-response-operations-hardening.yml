name: Global Campaign Response Operations Hardening Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign_response_production_readiness*.go"
      - "koschei/api/internal/services/global_campaign_response_dispatch*.go"
      - "koschei/api/internal/http/response_production_readiness*.go"
      - "koschei/api/internal/http/route_inventory.go"
      - ".github/workflows/global-campaign-response-operations-hardening.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign_response_production_readiness*.go"
      - "koschei/api/internal/services/global_campaign_response_dispatch*.go"
      - "koschei/api/internal/http/response_production_readiness*.go"
      - "koschei/api/internal/http/route_inventory.go"
      - ".github/workflows/global-campaign-response-operations-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-operations-hardening:
    name: Prove response operations remain fail-closed and non-authoritative
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_response_production_readiness.go internal/services/global_campaign_response_production_readiness_test.go internal/services/global_campaign_response_dispatch.go internal/services/global_campaign_response_dispatch_test.go internal/http/response_production_readiness.go internal/http/response_production_readiness_test.go internal/http/route_inventory.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/services/global_campaign_response_production_readiness.go internal/services/global_campaign_response_production_readiness_test.go internal/services/global_campaign_response_dispatch.go internal/services/global_campaign_response_dispatch_test.go internal/http/response_production_readiness.go internal/http/response_production_readiness_test.go internal/http/route_inventory.go
            exit 1
          fi
      - name: Run service acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^(TestGlobalCampaignResponseProductionReadiness|TestGlobalCampaignResponseDispatch)' -count=1
      - name: Run owner telemetry acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/http -run '^(TestResponseProductionReadinessTelemetry|TestOwnerRouteMapIncludesResponseProductionReadinessTelemetry|TestProductionRouteInventoryMatchesBootChain|TestDatabaseOptionalPathsAreRegistered)' -count=1
