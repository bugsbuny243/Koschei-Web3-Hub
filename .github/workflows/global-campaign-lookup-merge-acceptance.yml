name: Global Campaign Lookup Merge Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/migrations/125_global_campaign_store.sql"
      - "koschei/api/migrations/126_global_campaign_anchor_index.sql"
      - ".github/workflows/global-campaign-lookup-merge-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/migrations/125_global_campaign_store.sql"
      - "koschei/api/migrations/126_global_campaign_anchor_index.sql"
      - ".github/workflows/global-campaign-lookup-merge-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup-merge:
    name: Prove deterministic partial-window convergence on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koschei_campaign_lookup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d koschei_campaign_lookup_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify migration numbering
        run: python3 scripts/check_migration_numbering.py
      - name: Apply migrations on PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in $(find migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              --dbname=koschei_campaign_lookup_ci \
              --set=ON_ERROR_STOP=1 \
              --file="${migration}" >/dev/null
          done
      - name: Run Global Campaign lookup/merge acceptance under race detector
        env:
          KOSCHEI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/koschei_campaign_lookup_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignLookupMergePostgres17$' -count=1
