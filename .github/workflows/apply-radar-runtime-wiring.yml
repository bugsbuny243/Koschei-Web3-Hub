name: Apply Radar Runtime Wiring

on:
  push:
    branches:
      - integration/radar-runtime-wiring-2026-10-04

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/radar-runtime-wiring-2026-10-04
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/radar-runtime-wiring.patch.gz.b64 | gzip -d > /tmp/radar-runtime.patch
          echo "25009fca91609087a2573d452d74eb8a3d892cd61bea7ace520923e3ce3337aa  /tmp/radar-runtime.patch" | sha256sum -c -
          git apply --check /tmp/radar-runtime.patch
          git apply /tmp/radar-runtime.patch
          git diff --check

      - name: Commit source wiring
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/radar-runtime-wiring.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire ARVIS and Global Campaign runtime into Global Radar"
          git push origin HEAD:integration/radar-runtime-wiring-2026-10-04
