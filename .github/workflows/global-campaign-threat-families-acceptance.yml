name: Global Campaign Threat Families Acceptance

on:
  pull_request:
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/internal/services/threat_anticipation.go"
      - "koschei/api/internal/services/campaign_tempo_fingerprint.go"
      - ".github/workflows/global-campaign-threat-families-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/internal/services/global_campaign*.go"
      - "koschei/api/internal/services/threat_anticipation.go"
      - "koschei/api/internal/services/campaign_tempo_fingerprint.go"
      - ".github/workflows/global-campaign-threat-families-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threat-families:
    name: Prove deterministic campaign threat families
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - name: Download modules
        run: go mod download
      - name: Verify gofmt
        run: |
          set -euo pipefail
          files="$(gofmt -l internal/services/global_campaign_threat_families.go internal/services/global_campaign_threat_families_test.go)"
          if [ -n "${files}" ]; then
            printf '%s\n' "${files}"
            gofmt -d internal/services/global_campaign_threat_families.go internal/services/global_campaign_threat_families_test.go
            exit 1
          fi
      - name: Run threat family acceptance under race detector
        run: |
          set -euo pipefail
          go test -race -v ./internal/services -run '^TestGlobalCampaignThreatFamilies' -count=1
