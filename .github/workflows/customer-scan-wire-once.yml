name: Customer Scan Wire Once

on:
  push:
    paths:
      - '.github/workflows/customer-scan-wire-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire customer scan before static routes
        shell: python
        run: |
          from pathlib import Path
          p = Path('koschei/api/internal/http/server.go')
          s = p.read_text()
          needle = '\tregisterStatic(mux, staticDir)\n'
          replacement = '\tregisterCustomerScanRoutes(mux, config.solanaRPC)\n' + needle
          if replacement in s:
              raise SystemExit(0)
          if needle not in s:
              raise SystemExit('server registration anchor not found')
          p.write_text(s.replace(needle, replacement, 1))
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          git add koschei/api/internal/http/server.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'web3: inject Solana RPC into customer scan route'
          git push origin HEAD:main
