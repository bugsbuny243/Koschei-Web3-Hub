name: ClickHouse ARVIS Verdict Shadow CI

on:
  pull_request:
    paths:
      - "koschei/api/clickhouse/migrations/003_arvis_verdict_snapshots.sql"
      - "koschei/api/clickhouse/migrations/003_arvis_verdict_snapshots.sql.sha256"
      - "koschei/api/internal/clickhouse/verdict_shadow.go"
      - "koschei/api/internal/clickhouse/verdict_shadow_test.go"
      - "koschei/api/internal/clickhouse/verdict_migration.go"
      - "koschei/api/internal/clickhouse/verdict_migration_test.go"
      - "koschei/api/cmd/clickhouse-verdict-shadow/**"
      - "koschei/api/cmd/clickhouse-verdict-schema/**"
      - ".github/workflows/clickhouse-arvis-verdict-shadow-ci.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/clickhouse/migrations/003_arvis_verdict_snapshots.sql"
      - "koschei/api/internal/clickhouse/verdict_shadow.go"
      - "koschei/api/internal/clickhouse/verdict_migration.go"
      - "koschei/api/cmd/clickhouse-verdict-shadow/**"
      - "koschei/api/cmd/clickhouse-verdict-schema/**"
      - ".github/workflows/clickhouse-arvis-verdict-shadow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate additive ARVIS verdict shadow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.2
        env:
          CLICKHOUSE_DB: koschei_web3
        ports:
          - 8123:8123
        options: >-
          --health-cmd="clickhouse-client --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Require gofmt-clean verdict shadow paths
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l internal/clickhouse/verdict_shadow.go internal/clickhouse/verdict_shadow_test.go internal/clickhouse/verdict_migration.go internal/clickhouse/verdict_migration_test.go cmd/clickhouse-verdict-shadow cmd/clickhouse-verdict-schema)"
          test -z "${unformatted}" || { printf 'unformatted files:\n%s\n' "${unformatted}" >&2; exit 1; }

      - name: Verify reviewed migration checksum
        run: |
          set -euo pipefail
          cd clickhouse/migrations
          sha256sum -c 003_arvis_verdict_snapshots.sql.sha256

      - name: Validate ClickHouse migration on 26.2
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"
          docker exec -i "${container_id}" clickhouse-client --multiquery < clickhouse/migrations/003_arvis_verdict_snapshots.sql
          docker exec "${container_id}" clickhouse-client --query 'SHOW CREATE TABLE koschei_web3.arvis_verdict_snapshots' | tee "${RUNNER_TEMP}/verdict-shadow-create.txt"
          grep -Fq 'ReplacingMergeTree(source_version)' "${RUNNER_TEMP}/verdict-shadow-create.txt"
          grep -Fq '`verdict_id` UUID' "${RUNNER_TEMP}/verdict-shadow-create.txt"
          grep -Fq '`evidence` Array(String)' "${RUNNER_TEMP}/verdict-shadow-create.txt"
          grep -Fq '`signals` JSON' "${RUNNER_TEMP}/verdict-shadow-create.txt"
          source_updated_type="$(docker exec "${container_id}" clickhouse-client --query "SELECT type FROM system.columns WHERE database='koschei_web3' AND table='arvis_verdict_snapshots' AND name='source_updated_at' FORMAT TSVRaw")"
          test "${source_updated_type}" = "DateTime64(6, 'UTC')"

      - name: Validate replacement, case and hash invariants
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=clickhouse/clickhouse-server:26.2' --format '{{.ID}}' | head -n1)"
          test -n "${container_id}"
          docker exec -i "${container_id}" clickhouse-client --multiquery <<'SQL'
          INSERT INTO koschei_web3.arvis_verdict_snapshots
          (verdict_id,event_id,module_id,target,target_type,network,grade,risk_index,risk_level,verdict,recommendation,evidence,evidence_sha256,signals,signals_sha256,rule_version,signed,signature,source,event_type,provider,created_at,source_updated_at,source_version,schema_version)
          VALUES
          (toUUID('11111111-1111-1111-1111-111111111111'),toUUID('22222222-2222-2222-2222-222222222222'),'final_verdict_engine','AbCdEf123','token','solana-mainnet','C',41,'medium','REVIEW','first',['tx:a'],repeat('a',64),'{}',repeat('b',64),'rules-v1',1,'SigCase','arvis_stream','arvis_stream_verdict','solana_rpc',toDateTime64('2026-09-09 00:00:00.123456',6,'UTC'),toDateTime64('2026-09-09 00:00:01.000001',6,'UTC'),1,1),
          (toUUID('11111111-1111-1111-1111-111111111111'),toUUID('22222222-2222-2222-2222-222222222222'),'final_verdict_engine','AbCdEf123','token','solana-mainnet','B',62,'high','BLOCK','latest',['tx:a','slot:7'],repeat('c',64),'{}',repeat('d',64),'rules-v2',1,'SigCase','arvis_stream','arvis_stream_verdict','solana_rpc',toDateTime64('2026-09-09 00:00:00.123456',6,'UTC'),toDateTime64('2026-09-09 00:00:02.000002',6,'UTC'),2,1),
          (toUUID('33333333-3333-3333-3333-333333333333'),toUUID('00000000-0000-0000-0000-000000000000'),'final_verdict_engine','abcdef123','token','solana-mainnet','A',5,'low','ALLOW','case-sensitive target',['none'],repeat('e',64),'{}',repeat('f',64),'rules-v1',1,'SigOther','manual_scan','scan','solana_rpc',toDateTime64('2026-09-09 00:00:03.000003',6,'UTC'),toDateTime64('2026-09-09 00:00:03.000003',6,'UTC'),3,1);
          SQL
          replacement_count="$(docker exec "${container_id}" clickhouse-client --query "SELECT count() FROM koschei_web3.arvis_verdict_snapshots FINAL WHERE verdict_id=toUUID('11111111-1111-1111-1111-111111111111')")"
          replacement_verdict="$(docker exec "${container_id}" clickhouse-client --query "SELECT verdict FROM koschei_web3.arvis_verdict_snapshots FINAL WHERE verdict_id=toUUID('11111111-1111-1111-1111-111111111111') FORMAT TSVRaw")"
          case_distinct="$(docker exec "${container_id}" clickhouse-client --query "SELECT uniqExact(target) FROM koschei_web3.arvis_verdict_snapshots FINAL WHERE verdict_id IN (toUUID('11111111-1111-1111-1111-111111111111'),toUUID('33333333-3333-3333-3333-333333333333'))")"
          test "${replacement_count}" = "1"
          test "${replacement_verdict}" = "BLOCK"
          test "${case_distinct}" = "2"
          if docker exec -i "${container_id}" clickhouse-client --query "INSERT INTO koschei_web3.arvis_verdict_snapshots (verdict_id,module_id,target,network,verdict,evidence,evidence_sha256,signals,signals_sha256,rule_version,signed,source,created_at,source_updated_at,source_version) VALUES (toUUID('44444444-4444-4444-4444-444444444444'),'final_verdict_engine','BadHash','solana-mainnet','REVIEW',[],repeat('z',64),'{}',repeat('f',64),'rules-v1',1,'test',now64(6),now64(6),4)"; then
            echo "invalid verdict evidence hash unexpectedly accepted" >&2
            exit 1
          fi

      - name: Test verdict shadow client and schema guard
        run: go test ./internal/clickhouse -count=1

      - name: Compile verdict shadow commands
        run: go test ./cmd/clickhouse-verdict-shadow ./cmd/clickhouse-verdict-schema -count=1

      - name: Vet verdict shadow paths
        run: go vet ./internal/clickhouse ./cmd/clickhouse-verdict-shadow ./cmd/clickhouse-verdict-schema

      - name: Build verdict shadow commands
        run: |
          CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-verdict-shadow
          CGO_ENABLED=0 GOOS=linux go build ./cmd/clickhouse-verdict-schema
