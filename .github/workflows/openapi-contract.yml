name: OpenAPI Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate OpenAPI 3.1 syntax and semantics
        run: |
          python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
          openapi-spec-validator openapi.yaml
      - name: Synchronize generated OpenAPI contract
        run: |
          set -euo pipefail
          go run ./cmd/openapi-gen
          git add openapi.yaml
          if git diff --cached --quiet; then
            echo "OpenAPI already synchronized."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: sync generated OpenAPI contract'
            git push origin HEAD:main
          fi
      - name: Generate expected OpenAPI contract
        run: go run ./cmd/openapi-gen -output "${RUNNER_TEMP}/openapi.generated.yaml"
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi-generated-contract
          path: ${{ runner.temp }}/openapi.generated.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Verify registered route drift
        run: |
          go run ./cmd/openapi-gen -check
          go test ./internal/openapi -count=1
