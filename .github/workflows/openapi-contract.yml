name: OpenAPI Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  push:
    branches: [main]
    paths:
      - "koschei/api/openapi.yaml"
      - "koschei/api/cmd/openapi-gen/**"
      - "koschei/api/internal/openapi/**"
      - "koschei/api/internal/http/**"
      - ".github/workflows/openapi-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koschei/api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: koschei/api/go.mod
          cache-dependency-path: koschei/api/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate OpenAPI 3.1 syntax and semantics
        run: |
          python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
          openapi-spec-validator openapi.yaml
      - name: Refresh canonical OpenAPI contract on PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/openapi-gen
          if git diff --quiet -- openapi.yaml; then
            exit 0
          fi
          git config user.name "koschei-contract-bot"
          git config user.email "koschei-contract-bot@users.noreply.github.com"
          git add openapi.yaml
          git commit -m "docs: refresh generated OpenAPI contract"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Generate expected OpenAPI contract
        run: go run ./cmd/openapi-gen -output "${RUNNER_TEMP}/openapi.generated.yaml"
      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi-generated-contract
          path: ${{ runner.temp }}/openapi.generated.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Verify registered route drift
        run: |
          go run ./cmd/openapi-gen -check
          go test ./internal/openapi -count=1
