name: Temporary customer final receipt gofmt

on:
  pull_request:
    paths:
      - 'koschei/api/internal/handlers/**'
      - '.github/workflows/temporary-customer-receipt-gofmt.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical gofmt sources
        run: |
          set -euo pipefail
          for file in koschei/api/internal/handlers/customer_canonical_receipt.go koschei/api/internal/handlers/customer_canonical_receipt_test.go koschei/api/internal/handlers/security_radar.go; do
            gofmt -w "$file"
            echo "FORMATTED_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
