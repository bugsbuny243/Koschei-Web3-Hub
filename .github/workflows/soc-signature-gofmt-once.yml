name: SOC Signature Journal GoFmt One Shot
on:
  push:
    branches:
      - fix/solana-journal-gap-replay-durable-proof-20261101
    paths:
      - .github/workflows/soc-signature-gofmt-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Format signature journal test
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w koschei/api/internal/services/security_radar_signature_journal_test.go
          if ! git diff --quiet -- koschei/api/internal/services/security_radar_signature_journal_test.go; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- koschei/api/internal/services/security_radar_signature_journal_test.go
            git commit -m 'style(go): format signature journal acceptance corpus'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
